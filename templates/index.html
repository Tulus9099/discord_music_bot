<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Discord Music Controller</title>
<style>
  :root {
    --bg: #1a1a2e;
    --panel: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --accent2: #533483;
    --text: #eaeaea;
    --muted: #8892a4;
    --success: #4ecca3;
    --border: #1e2d50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
  h1 { font-size: 1.6rem; font-weight: 700; }
  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; color: var(--success); }
  h3 { font-size: 0.95rem; font-weight: 600; }

  .header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .header .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .main {
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--border);
  }

  select, input[type="text"], input[type="url"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input:focus { border-color: var(--accent); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 8px 14px;
    transition: opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity: 0.85; }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-success { background: var(--success); color: #111; }
  .btn-muted { background: #2a3a55; color: var(--text); }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-small { padding: 4px 10px; font-size: 0.8rem; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }

  .player-card {
    background: linear-gradient(135deg, var(--card), var(--accent2));
    border-radius: 12px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .now-playing { font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .track-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; min-height: 1.4em; }
  .track-category { font-size: 0.82rem; color: var(--success); margin-bottom: 16px; }

  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .controls button { min-width: 44px; }

  .volume-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .volume-row label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .volume-val { font-size: 0.82rem; color: var(--muted); width: 36px; text-align: right; }

  .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    background: var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid transparent;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab .del-cat { font-size: 0.75rem; opacity: 0.7; }
  .tab .del-cat:hover { opacity: 1; color: #fff; }

  .track-list { display: flex; flex-direction: column; gap: 6px; }
  .track-item {
    background: var(--panel);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }
  .track-item:hover { border-color: var(--accent2); }
  .track-item.active { border-color: var(--success); background: #0d2a24; }
  .track-num { font-size: 0.8rem; color: var(--muted); width: 20px; text-align: center; }
  .track-info { flex: 1; min-width: 0; }
  .track-name { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-url { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .add-track-form { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .add-track-form .row { gap: 6px; }

  .status-bar {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .badge {
    background: var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 0.78rem;
  }
  .badge.playing { background: var(--success); color: #111; }
  .badge.paused { background: #e67e22; color: #111; }

  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 0.9rem; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 0.88rem;
    z-index: 999;
    transition: opacity 0.4s;
    max-width: 300px;
  }
  .toast.ok { border-color: var(--success); color: var(--success); }
  .toast.err { border-color: var(--accent); color: var(--accent); }
  .toast.hidden { opacity: 0; pointer-events: none; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="dot" id="statusDot"></div>
  <h1>🎵 Discord Music Controller</h1>
  <div style="margin-left:auto" class="status-bar">
    <span id="statusBadge" class="badge">Disconnected</span>
    <span id="queueInfo" style="display:none">Queue: <span id="queueLen">0</span></span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="card">
      <h2>Connect Bot</h2>
      <div style="display:flex;flex-direction:column;gap:8px">
        <select id="guildSelect" onchange="loadChannels()">
          <option value="">Select Server...</option>
        </select>
        <select id="channelSelect">
          <option value="">Select Voice Channel...</option>
        </select>
        <div class="row">
          <button class="btn-success" style="flex:1" onclick="joinChannel()">Join</button>
          <button class="btn-danger" style="flex:1" onclick="leaveChannel()">Leave</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Add Category</h2>
      <div class="row">
        <input type="text" id="newCatInput" placeholder="e.g. tavern_music" />
        <button class="btn-primary btn-small" onclick="addCategory()">+</button>
      </div>
    </div>

    <div class="card" style="flex:1">
      <h2>Categories</h2>
      <div id="categoryList" class="track-list"></div>
    </div>
  </div>

  <div class="main">
    <div class="player-card">
      <div class="now-playing">Now Playing</div>
      <div class="track-title" id="currentTitle">—</div>
      <div class="track-category" id="currentCategory"></div>
      <div class="controls">
        <button class="btn-success" onclick="playCategory()" id="btnPlayCat" title="Play current category">▶ Play Category</button>
        <button class="btn-muted" onclick="pauseMusic()" id="btnPause">⏸ Pause</button>
        <button class="btn-success" onclick="resumeMusic()" id="btnResume" style="display:none">▶ Resume</button>
        <button class="btn-muted" onclick="skipTrack()" title="Skip">⏭ Skip</button>
        <button class="btn-danger" onclick="stopMusic()">⏹ Stop</button>
        <button class="btn-muted" id="btnLoop" onclick="toggleLoop()">🔁 Loop: Off</button>
      </div>
      <div class="volume-row">
        <label>Volume</label>
        <input type="range" min="0" max="100" value="50" id="volumeSlider" oninput="setVolume(this.value)" />
        <span class="volume-val" id="volumeVal">50%</span>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <h2 style="margin:0">Playlist</h2>
        <span id="activeCatLabel" style="font-size:0.82rem;color:var(--muted)">Select a category</span>
      </div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div id="trackList" class="track-list">
        <div class="empty">Select a category to see tracks</div>
      </div>
      <div class="add-track-form" id="addTrackForm" style="display:none">
        <h3>Add YouTube Track</h3>
        <input type="url" id="trackUrl" placeholder="https://www.youtube.com/watch?v=..." />
        <input type="text" id="trackTitle" placeholder="Title (optional)" />
        <button class="btn-primary btn-small" onclick="addTrack()">Add Track</button>
      </div>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
  let selectedCategory = null;
  let categories = {};
  let loopEnabled = false;
  let statusInterval = null;

  function showToast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (ok ? 'ok' : 'err');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
  }

  async function api(method, path, body) {
    try {
      const res = await fetch('/api' + path, {
        method,
        headers: body ? {'Content-Type': 'application/json'} : {},
        body: body ? JSON.stringify(body) : undefined
      });
      return await res.json();
    } catch(e) {
      showToast('Network error', false);
      return null;
    }
  }

  async function loadGuilds() {
    const guilds = await api('GET', '/guilds');
    if (!guilds) return;
    const sel = document.getElementById('guildSelect');
    guilds.forEach(g => {
      const o = document.createElement('option');
      o.value = g.id;
      o.textContent = g.name;
      sel.appendChild(o);
    });
  }

  async function loadChannels() {
    const guildId = document.getElementById('guildSelect').value;
    const sel = document.getElementById('channelSelect');
    sel.innerHTML = '<option value="">Select Voice Channel...</option>';
    if (!guildId) return;
    const channels = await api('GET', '/guilds/' + guildId + '/channels');
    if (!channels) return;
    channels.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = '🔊 ' + c.name;
      sel.appendChild(o);
    });
  }

  async function joinChannel() {
    const guildId = document.getElementById('guildSelect').value;
    const channelId = document.getElementById('channelSelect').value;
    if (!guildId || !channelId) { showToast('Select server and channel', false); return; }
    const r = await api('POST', '/join', {guild_id: guildId, channel_id: channelId});
    if (r) showToast(r.message, r.ok);
  }

  async function leaveChannel() {
    const r = await api('POST', '/leave');
    if (r) showToast(r.ok ? 'Left channel' : 'Not connected', r.ok);
  }

  async function loadCategories() {
    categories = await api('GET', '/categories');
    if (!categories) return;
    renderCategoryList();
    renderCategoryTabs();
    if (selectedCategory && categories[selectedCategory]) {
      renderTracks(selectedCategory);
    } else if (selectedCategory && !categories[selectedCategory]) {
      selectedCategory = null;
      document.getElementById('trackList').innerHTML = '<div class="empty">Select a category to see tracks</div>';
      document.getElementById('addTrackForm').style.display = 'none';
    }
  }

  function renderCategoryList() {
    const el = document.getElementById('categoryList');
    const keys = Object.keys(categories);
    if (!keys.length) { el.innerHTML = '<div class="empty">No categories</div>'; return; }
    el.innerHTML = keys.map(k => `
      <div class="track-item ${k === selectedCategory ? 'active' : ''}" onclick="selectCategory('${k}')">
        <div class="track-info">
          <div class="track-name">${k.replace(/_/g,' ')}</div>
          <div class="track-url">${categories[k].length} track(s)</div>
        </div>
        <button class="btn-danger btn-small" onclick="event.stopPropagation();deleteCategory('${k}')">🗑</button>
      </div>
    `).join('');
  }

  function renderCategoryTabs() {
    const el = document.getElementById('categoryTabs');
    const keys = Object.keys(categories);
    el.innerHTML = keys.map(k => `
      <div class="tab ${k === selectedCategory ? 'active' : ''}" onclick="selectCategory('${k}')">
        ${k.replace(/_/g,' ')}
      </div>
    `).join('');
  }

  function selectCategory(cat) {
    selectedCategory = cat;
    document.getElementById('activeCatLabel').textContent = cat.replace(/_/g,' ');
    renderCategoryList();
    renderCategoryTabs();
    renderTracks(cat);
    document.getElementById('addTrackForm').style.display = 'flex';
    document.getElementById('addTrackForm').style.flexDirection = 'column';
  }

  function renderTracks(cat) {
    const tracks = categories[cat] || [];
    const el = document.getElementById('trackList');
    if (!tracks.length) {
      el.innerHTML = '<div class="empty">No tracks yet. Add a YouTube link below.</div>';
      return;
    }
    el.innerHTML = tracks.map((t, i) => `
      <div class="track-item" id="track_${i}">
        <div class="track-num">${i+1}</div>
        <div class="track-info">
          <div class="track-name">${t.title || t.url}</div>
          <div class="track-url">${t.url}</div>
        </div>
        <button class="btn-success btn-small" onclick="playTrack('${cat}',${i})">▶</button>
        <button class="btn-danger btn-small" onclick="removeTrack('${cat}',${i})">🗑</button>
      </div>
    `).join('');
  }

  async function addCategory() {
    const input = document.getElementById('newCatInput');
    const name = input.value.trim();
    if (!name) return;
    const r = await api('POST', '/categories', {name});
    if (r && r.ok) { input.value = ''; showToast('Category added'); await loadCategories(); }
    else if (r) showToast(r.message, false);
  }

  async function deleteCategory(name) {
    if (!confirm(`Delete category "${name}"?`)) return;
    const r = await api('DELETE', '/categories/' + name);
    if (r && r.ok) { showToast('Deleted'); if (selectedCategory === name) selectedCategory = null; await loadCategories(); }
  }

  async function addTrack() {
    const url = document.getElementById('trackUrl').value.trim();
    const title = document.getElementById('trackTitle').value.trim();
    if (!url || !selectedCategory) { showToast('Enter a URL', false); return; }
    const r = await api('POST', '/categories/' + selectedCategory + '/tracks', {url, title});
    if (r && r.ok) {
      document.getElementById('trackUrl').value = '';
      document.getElementById('trackTitle').value = '';
      showToast('Track added');
      await loadCategories();
    }
  }

  async function removeTrack(cat, index) {
    const r = await api('DELETE', '/categories/' + cat + '/tracks/' + index);
    if (r && r.ok) { showToast('Removed'); await loadCategories(); }
  }

  async function playTrack(cat, index) {
    const track = categories[cat][index];
    const r = await api('POST', '/play/track', {track});
    if (r) showToast(r.ok ? 'Playing: ' + (track.title || track.url) : r.message, r.ok);
  }

  async function playCategory() {
    if (!selectedCategory) { showToast('Select a category first', false); return; }
    const r = await api('POST', '/play/category', {category: selectedCategory});
    if (r) showToast(r.ok ? 'Playing ' + selectedCategory : r.message, r.ok);
  }

  async function stopMusic() {
    await api('POST', '/stop');
    showToast('Stopped');
  }

  async function pauseMusic() {
    const r = await api('POST', '/pause');
    if (r && r.ok) {
      document.getElementById('btnPause').style.display = 'none';
      document.getElementById('btnResume').style.display = '';
    }
  }

  async function resumeMusic() {
    const r = await api('POST', '/resume');
    if (r && r.ok) {
      document.getElementById('btnResume').style.display = 'none';
      document.getElementById('btnPause').style.display = '';
    }
  }

  async function skipTrack() {
    await api('POST', '/skip');
    showToast('Skipped');
  }

  async function setVolume(val) {
    document.getElementById('volumeVal').textContent = val + '%';
    await api('POST', '/volume', {volume: val / 100});
  }

  async function toggleLoop() {
    loopEnabled = !loopEnabled;
    const r = await api('POST', '/loop', {loop: loopEnabled});
    document.getElementById('btnLoop').textContent = '🔁 Loop: ' + (loopEnabled ? 'On' : 'Off');
    document.getElementById('btnLoop').style.background = loopEnabled ? 'var(--accent2)' : '';
  }

  async function updateStatus() {
    const s = await api('GET', '/status');
    if (!s) return;

    const dot = document.getElementById('statusDot');
    const badge = document.getElementById('statusBadge');

    dot.className = 'dot ' + (s.connected ? 'connected' : '');

    if (s.is_playing) {
      badge.textContent = 'Playing';
      badge.className = 'badge playing';
      document.getElementById('btnPause').style.display = '';
      document.getElementById('btnResume').style.display = 'none';
    } else if (s.is_paused) {
      badge.textContent = 'Paused';
      badge.className = 'badge paused';
      document.getElementById('btnPause').style.display = 'none';
      document.getElementById('btnResume').style.display = '';
    } else {
      badge.textContent = s.connected ? 'Connected' : 'Disconnected';
      badge.className = 'badge';
    }

    if (s.current_track) {
      document.getElementById('currentTitle').textContent = s.current_track.title || s.current_track.url;
    } else {
      document.getElementById('currentTitle').textContent = '—';
    }

    document.getElementById('currentCategory').textContent = s.current_category ? '📁 ' + s.current_category.replace(/_/g,' ') : '';

    const qi = document.getElementById('queueInfo');
    qi.style.display = s.queue_length > 0 ? '' : 'none';
    document.getElementById('queueLen').textContent = s.queue_length;

    loopEnabled = s.loop;
    document.getElementById('btnLoop').textContent = '🔁 Loop: ' + (s.loop ? 'On' : 'Off');
    document.getElementById('btnLoop').style.background = s.loop ? 'var(--accent2)' : '';
  }

  async function init() {
    await loadGuilds();
    await loadCategories();
    await updateStatus();
    statusInterval = setInterval(updateStatus, 3000);
  }

  init();
</script>
</body>
</html>
