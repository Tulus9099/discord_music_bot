[project]
name = "discord-play-music"
version = "0.1.0"
description = "Discord bot streaming YouTube music to a voice channel, controlled from a local web panel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Keep the davey 0.1.x line that discord.py 2.7.1 was released and tested with (voice E2EE).
    "davey>=0.1.4,<0.2",
    "discord-py[voice]>=2.7.1",
    "flask>=3.1.3",
    "pynacl>=1.5.0",
    "python-dotenv>=1.2.2",
    "static-ffmpeg>=3.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
